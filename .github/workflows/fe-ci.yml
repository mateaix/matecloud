name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'mate-ui/**'
  pull_request:
    branches: [main]
    paths:
      - 'mate-ui/**'

defaults:
  run:
    working-directory: mate-ui

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Type check
        run: pnpm typecheck
        continue-on-error: true

      - name: Build
        run: pnpm build
